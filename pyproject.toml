[project]
name = "ragkit"
version = "0.1.0"
description = "Reusable retrieval and generation pipeline over Postgres/pgvector and Elasticsearch."
readme = "README.md"
authors = [
    { name = "Shadrach Oloyede", email = "shadrachtemitayo@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.5.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
postgres = [
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "psycopg[binary]>=3.3.4",
]
elasticsearch = [
    "elasticsearch>=8.15.0,<9",
    "langchain-text-splitters>=1.1.2",
]
voyage = ["langchain-voyageai>=0.4.0"]
openai = ["langchain-openai>=1.4.1"]
rerank = ["cohere>=7.0.8"]
tracing = ["braintrust>=0.35.0", "python-dotenv>=1.0.1"]
all = [
    "ragkit[postgres,elasticsearch,voyage,openai,rerank,tracing]",
]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragkit", "ragkit.elasticsearch", "ragkit.vector_store"]

[tool.setuptools.package-dir]
ragkit = "src"

[tool.setuptools.package-data]
ragkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["ragkit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
ignore = ["D417", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
